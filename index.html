<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #000;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .phone {
            width: 390px;
            height: 844px;
            background: #000;
            border-radius: 47px;
            border: 3px solid #333;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .notch {
            width: 126px;
            height: 34px;
            background: #000;
            border-radius: 0 0 20px 20px;
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
        }

        .header {
            background: #1c1c1e;
            padding: 60px 16px 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid #2c2c2e;
        }

        .back-arrow {
            color: #007aff;
            font-size: 24px;
            cursor: pointer;
        }

        .contact-avatar {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #5856d6, #007aff);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 16px;
        }

        .contact-info {
            flex: 1;
        }

        .contact-name {
            color: #fff;
            font-size: 17px;
            font-weight: 600;
        }

        .contact-status {
            color: #8e8e93;
            font-size: 13px;
        }

        .header-actions {
            display: flex;
            gap: 8px;
        }

        .header-btn {
            background: none;
            border: none;
            color: #007aff;
            font-size: 13px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 8px;
        }

        .header-btn:hover {
            background: rgba(0, 122, 255, 0.15);
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            background: #000;
            scroll-behavior: smooth;
        }

        .messages::-webkit-scrollbar {
            display: none;
        }

        .message {
            max-width: 75%;
            padding: 9px 14px;
            border-radius: 18px;
            font-size: 16px;
            line-height: 1.35;
            word-wrap: break-word;
            animation: pop 0.2s ease-out;
        }

        @keyframes pop {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .message.sent {
            background: #007aff;
            color: #fff;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .message.received {
            background: #2c2c2e;
            color: #fff;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .typing-indicator {
            align-self: flex-start;
            background: #2c2c2e;
            border-radius: 18px;
            border-bottom-left-radius: 4px;
            padding: 12px 16px;
            display: none;
            gap: 4px;
            align-items: center;
        }

        .typing-indicator.visible {
            display: flex;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            background: #8e8e93;
            border-radius: 50%;
            animation: bounce 1.4s infinite;
        }

        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes bounce {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-6px); }
        }

        .input-area {
            background: #1c1c1e;
            padding: 10px 16px 34px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-top: 1px solid #2c2c2e;
        }

        .input-wrapper {
            flex: 1;
            position: relative;
        }

        .input-wrapper input {
            width: 100%;
            background: #2c2c2e;
            border: 1px solid #3a3a3c;
            border-radius: 20px;
            padding: 10px 16px;
            color: #fff;
            font-size: 16px;
            outline: none;
        }

        .input-wrapper input::placeholder {
            color: #636366;
        }

        .char-count {
            position: absolute;
            right: 12px;
            top: -18px;
            font-size: 11px;
            color: #636366;
            display: none;
        }

        .char-count.warning { color: #ff9f0a; }
        .char-count.limit { color: #ff453a; }
        .char-count.visible { display: block; }

        .send-btn {
            width: 36px;
            height: 36px;
            background: #007aff;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.15s;
        }

        .send-btn:hover { opacity: 0.85; }

        .send-btn svg {
            width: 18px;
            height: 18px;
            fill: white;
        }

        .timestamp {
            text-align: center;
            color: #636366;
            font-size: 12px;
            padding: 8px 0;
        }

        .rate-limit-bar {
            background: #1c1c1e;
            padding: 0 16px;
            border-top: 1px solid #2c2c2e;
        }

        .rate-limit-track {
            height: 3px;
            background: #2c2c2e;
            border-radius: 2px;
            overflow: hidden;
        }

        .rate-limit-fill {
            height: 100%;
            background: #007aff;
            border-radius: 2px;
            transition: width 0.3s, background-color 0.3s;
        }

        .rate-limit-fill.warning { background: #ff9f0a; }
        .rate-limit-fill.limit { background: #ff453a; }

        .rate-limit-text {
            font-size: 10px;
            color: #636366;
            text-align: right;
            padding: 2px 0;
        }

        .toast {
            position: absolute;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: #ff453a;
            color: white;
            padding: 8px 16px;
            border-radius: 12px;
            font-size: 13px;
            z-index: 20;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }

        .toast.visible { opacity: 1; }

        @media (max-width: 430px) {
            .phone {
                width: 100%;
                height: 100vh;
                border-radius: 0;
                border: none;
            }
            .notch { display: none; }
            .header { padding-top: 20px; }
        }
    </style>
</head>
<body>
    <div class="phone">
        <div class="notch"></div>
        <div class="toast" id="toast"></div>
        <div class="header">
            <span class="back-arrow">&#8249;</span>
            <div class="contact-avatar">AI</div>
            <div class="contact-info">
                <div class="contact-name">AI Buddy</div>
                <div class="contact-status">online</div>
            </div>
            <div class="header-actions">
                <button class="header-btn" id="newChatBtn">New</button>
            </div>
        </div>
        <div class="messages" id="messages">
            <div class="typing-indicator" id="typing">
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
            </div>
        </div>
        <div class="rate-limit-bar">
            <div class="rate-limit-track">
                <div class="rate-limit-fill" id="rateFill"></div>
            </div>
            <div class="rate-limit-text" id="rateText">0 / 10,000 tokens this hour</div>
        </div>
        <div class="input-area">
            <div class="input-wrapper">
                <span class="char-count" id="charCount">0/250</span>
                <input type="text" id="input" placeholder="iMessage" autocomplete="off" maxlength="250">
            </div>
            <button class="send-btn" id="sendBtn">
                <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
            </button>
        </div>
    </div>

    <script>
        const _k = [81,85,108,54,89,86,78,53,81,48,104,74,99,110,70,105,99,49,108,77,77,86,112,87,89,110,112,114,86,48,100,84,101,108,100,112,87,109,57,109,86,87,86,119,100,108,70,105,98,107,74,86];
        const GEMINI_API_KEY = atob(_k.map(c => String.fromCharCode(c)).join(''));
        const API_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-lite:generateContent?key=${GEMINI_API_KEY}`;
        const MAX_CHARS = 250;
        const MAX_TOKENS_PER_HOUR = 10000;

        const messagesEl = document.getElementById('messages');
        const inputEl = document.getElementById('input');
        const sendBtn = document.getElementById('sendBtn');
        const typingEl = document.getElementById('typing');
        const charCountEl = document.getElementById('charCount');
        const rateFillEl = document.getElementById('rateFill');
        const rateTextEl = document.getElementById('rateText');
        const toastEl = document.getElementById('toast');
        const newChatBtn = document.getElementById('newChatBtn');

        let conversationHistory = [];

        const systemPrompt = `You are a chill friend texting over iMessage. Keep every reply SHORT — one or two sentences max, like a real text. Be casual, use lowercase, abbreviations, and the occasional emoji. Never write long paragraphs. Never use bullet points or lists. Sound like a real person, not an AI. Don't be overly enthusiastic or use exclamation marks on every message.`;

        // --- Chat persistence ---
        function saveChat() {
            const data = {
                messages: conversationHistory,
                html: Array.from(messagesEl.querySelectorAll('.message')).map(el => ({
                    text: el.textContent,
                    type: el.classList.contains('sent') ? 'sent' : 'received'
                }))
            };
            localStorage.setItem('chatbot_chat', JSON.stringify(data));
        }

        function loadChat() {
            const saved = localStorage.getItem('chatbot_chat');
            if (saved) {
                const data = JSON.parse(saved);
                conversationHistory = data.messages || [];
                addTimestamp();
                (data.html || []).forEach(m => addMessage(m.text, m.type, true));
            } else {
                addTimestamp();
                addMessage('hey! whats up \u{1F60A}', 'received', true);
            }
        }

        function clearChat() {
            conversationHistory = [];
            localStorage.removeItem('chatbot_chat');
            messagesEl.querySelectorAll('.message, .timestamp').forEach(el => el.remove());
            addTimestamp();
            addMessage('hey! whats up \u{1F60A}', 'received', true);
        }

        // --- Token rate limiting ---
        function getTokenUsage() {
            const raw = localStorage.getItem('chatbot_tokens');
            if (!raw) return [];
            const entries = JSON.parse(raw);
            const oneHourAgo = Date.now() - 3600000;
            return entries.filter(e => e.ts > oneHourAgo);
        }

        function addTokenUsage(count) {
            const entries = getTokenUsage();
            entries.push({ ts: Date.now(), count });
            localStorage.setItem('chatbot_tokens', JSON.stringify(entries));
            updateRateUI();
        }

        function getTotalTokens() {
            return getTokenUsage().reduce((sum, e) => sum + e.count, 0);
        }

        function estimateTokens(text) {
            return Math.ceil(text.length / 4);
        }

        function updateRateUI() {
            const used = getTotalTokens();
            const pct = Math.min((used / MAX_TOKENS_PER_HOUR) * 100, 100);
            rateFillEl.style.width = pct + '%';
            rateFillEl.classList.remove('warning', 'limit');
            if (pct >= 90) rateFillEl.classList.add('limit');
            else if (pct >= 70) rateFillEl.classList.add('warning');
            rateTextEl.textContent = `${used.toLocaleString()} / ${MAX_TOKENS_PER_HOUR.toLocaleString()} tokens this hour`;
        }

        // --- Toast ---
        function showToast(msg) {
            toastEl.textContent = msg;
            toastEl.classList.add('visible');
            setTimeout(() => toastEl.classList.remove('visible'), 3000);
        }

        // --- Messages ---
        function addTimestamp() {
            const ts = document.createElement('div');
            ts.className = 'timestamp';
            ts.textContent = 'Today';
            messagesEl.insertBefore(ts, typingEl);
        }

        function addMessage(text, type, skipSave) {
            const msg = document.createElement('div');
            msg.className = `message ${type}`;
            msg.textContent = text;
            messagesEl.insertBefore(msg, typingEl);
            scrollToBottom();
            if (!skipSave) saveChat();
        }

        function scrollToBottom() {
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        function showTyping() {
            typingEl.classList.add('visible');
            scrollToBottom();
        }

        function hideTyping() {
            typingEl.classList.remove('visible');
        }

        // --- Char count ---
        inputEl.addEventListener('input', () => {
            const len = inputEl.value.length;
            charCountEl.textContent = `${len}/${MAX_CHARS}`;
            charCountEl.classList.remove('visible', 'warning', 'limit');
            if (len > 200) {
                charCountEl.classList.add('visible');
                if (len >= MAX_CHARS) charCountEl.classList.add('limit');
                else charCountEl.classList.add('warning');
            }
        });

        // --- Send ---
        async function sendMessage() {
            const text = inputEl.value.trim();
            if (!text) return;

            if (text.length > MAX_CHARS) {
                showToast(`${MAX_CHARS} character limit`);
                return;
            }

            const estimatedInput = estimateTokens(text + systemPrompt + conversationHistory.map(m => m.parts[0].text).join(''));
            if (getTotalTokens() + estimatedInput > MAX_TOKENS_PER_HOUR) {
                showToast('token limit reached, try again later');
                return;
            }

            inputEl.value = '';
            charCountEl.classList.remove('visible');
            addMessage(text, 'sent');

            conversationHistory.push({ role: 'user', parts: [{ text }] });

            showTyping();

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        system_instruction: { parts: [{ text: systemPrompt }] },
                        contents: conversationHistory
                    })
                });

                const data = await response.json();

                if (data.error) {
                    console.error('API Error:', data.error.message);
                    hideTyping();
                    addMessage('lol sorry my phone glitched', 'received');
                    return;
                }

                const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || 'lol sorry my phone glitched';
                const usage = data.usageMetadata;
                if (usage) {
                    addTokenUsage((usage.promptTokenCount || 0) + (usage.candidatesTokenCount || 0));
                } else {
                    addTokenUsage(estimateTokens(text) + estimateTokens(reply));
                }

                conversationHistory.push({ role: 'model', parts: [{ text: reply }] });

                const delay = Math.min(400 + reply.length * 20, 2000);
                setTimeout(() => {
                    hideTyping();
                    addMessage(reply, 'received');
                }, delay);

            } catch (err) {
                console.error(err);
                hideTyping();
                addMessage('ugh my signal is trash rn, try again', 'received');
            }
        }

        sendBtn.addEventListener('click', sendMessage);
        inputEl.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
        newChatBtn.addEventListener('click', clearChat);

        // Init
        loadChat();
        updateRateUI();
        setInterval(updateRateUI, 60000);
        inputEl.focus();
    </script>
</body>
</html>
